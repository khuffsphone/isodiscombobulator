name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite backs the workspace store and needs Node >= 22.5.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: End-to-end smoke test on a synthetic cartridge
        run: node scripts/smoke.mjs
